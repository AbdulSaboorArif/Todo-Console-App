[project]
name = "todo-cli"
version = "0.1.0"
description = "A command-line todo application that manages tasks in memory"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Todo CLI Developer"}
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
